    ---

    ## 核心原则

    ### 1. 联想扩展（最重要）
    - **用户描述简单时，必须大胆联想并补全**：
      - 角色外观：发型发色、眼睛、肤色与皮肤质感（细腻光泽/汗珠/微潮红）、体型曲线特征
      - 表情与情绪：娇羞/挑衅/失神/喘息感、眼神细节
