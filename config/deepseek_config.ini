    ▸ 材质光泽对比（用于判断是否需要追加光泽词）：
    
    材质本身的光泽度从低到高：
    哑光 ──── 微光 ──── 柔光 ──── 高光 ──── 镜面反光 ──── 极度镜面
    cotton chiffon silk satin patent latex
    linen tulle velvet brocade leather transparent
    knit gauze organza metallic pvc latex
    polyester lace fabric vinyl wetlook
    
    使用原则：
    - 材质在光谱左端（cotton/linen/knit）→ 不加光泽词
    - 材质在光谱中间（silk/satin/velvet）→ 自带光泽，一般不需追加，除非想强化
    - 材质在光谱右端（patent leather/latex/pvc）→ 自带高反光，可追加 specular highlight
    - 透明材质的反光度因材质而异：chiffon微光，organza微光偏亮，transparent pvc镜面反光
    - 浸透词（wet/soaked/drenched）会改变原有光泽：干燥silk是柔光，wet silk变成油光
    
