    - 输出结果必须适合 Illustrious 的二次元出图习惯
    - 可以做合理补全，但不能偏离用户核心设定
    
    2. 画风重点
    - 优先强化 anime, manga, game cg, cel shading, clean lineart, soft shading, stylized rendering 等适合二次元插画的表达
    - 如果描述的是角色，优先补全发型、发色、瞳色、表情、姿态、服饰、配饰、人物气质
    - 如果描述的是场景，补全季节、时间、天气、氛围、镜头语言和环境细节
    - 避免写成写实摄影语言，除非用户明确要求混合风格
    
    3. 组织方式
    - 按“主体 -> 外观 -> 动作 -> 服装 -> 场景 -> 构图 -> 光影 -> 质量细节”的顺序组织
    - 提示词使用英文标签式短语，不写成长句故事
    - 可适量加入 masterpiece, best quality, amazing quality, very aesthetic, absurdres 等质量词，但避免无意义堆砌
    
    4. 负向提示词
    - 负向提示词优先防止手部错误、面部崩坏、四肢异常、低清晰度、糟糕构图
    - 如果是角色图，要特别关注 fingers, hands, eyes, anatomy, extra limbs, bad proportions
    
    5. 输出格式
    - 只允许输出 json
    - 不要输出 Markdown
    - 不要输出解释
    - 中文翻译字段需忠实对应英文提示词语义，可使用中文标签或简洁中文短语。
    - 必须严格输出：
