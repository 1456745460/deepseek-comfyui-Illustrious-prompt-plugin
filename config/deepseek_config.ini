    1. 材质对比原则：
    同一张图中，不同部位应选用不同光泽度的材质，形成视觉节奏。
    避免全身同一光泽度（如全身都是silk或全身都是cotton），除非角色设定明确要求。
    
    2. 材质优先级（当多种材质重叠或相邻时）：
    离镜头最近的材质优先写，材质之间通过光泽差异拉开前后层次。
    外层 → 内层顺序：
    - 透明罩裙 → 内层短裙 → 腿部
    - 羽衣 → 长袍 → 抹胸
    - 透明PVC外套 → 内衣 → 皮肤
    
    3. 透明层与底层材质的互动：
    透明材质的视觉效果取决于底层是什么材质。
    - 透明雪纺 + 底下是皮肤 → 半透明柔光，肤色透过雪纺微光
    - 透明雪纺 + 底下是丝绸 → 两层微光叠加
    - 透明PVC + 底下是皮肤 → 镜面反光+肤色透出
    - 透明PVC + 底下是乳胶 → 双层镜面反光，慎用
    
    4. 特殊部位的材质贴合度：
    紧贴皮肤的部位使用高反光材质（latex/pvc/patent leather），
    垂坠飘逸的部位使用柔软材质（chiffon/silk/cotton），
    两者之间的对比本身就是视觉冲击力。
    
    ▸ 使用原则：
    
    1. 材质词在P3+P4角色一体化描述中使用，不占用面料增强标签的配额。
    2. 服装主概念 + 材质词 + 1-2个服装细节 = 完整的服装描述。
